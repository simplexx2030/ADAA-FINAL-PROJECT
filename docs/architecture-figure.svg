<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1000" width="1480" height="1000" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1480" height="1000" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="740" y="46" text-anchor="middle" font-size="27" font-weight="bold" fill="#111">ADAA — Workforce Coordination Agent</text>
  <text x="740" y="74" text-anchor="middle" font-size="15.5" fill="#444">A request in plain language enters at the left; a confirmed, evidenced workforce leaves at the right</text>

  <!-- legend -->
  <rect x="452" y="92" width="20" height="14" fill="#d9e6f2" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="479" y="104" font-size="13.5" fill="#333">Reasoning layer — Google Gemini</text>
  <rect x="742" y="92" width="20" height="14" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="769" y="104" font-size="13.5" fill="#333">Deterministic application logic (Python, tested)</text>

  <!-- ================= PIPELINE ================= -->
  <text x="60" y="152" font-size="16.5" font-weight="bold" fill="#111">THE PIPELINE</text>
  <line x1="60" y1="160" x2="1420" y2="160" stroke="#bbb" stroke-width="1"/>

  <!-- input -->
  <rect x="60" y="182" width="150" height="86" rx="5" fill="#f4f4f4" stroke="#555" stroke-width="1.4"/>
  <text x="135" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">CONTRACTOR</text>
  <text x="135" y="231" text-anchor="middle" font-size="11.5" font-style="italic" fill="#444">"I need 8 masons</text>
  <text x="135" y="247" text-anchor="middle" font-size="11.5" font-style="italic" fill="#444">tomorrow at 8 AM</text>
  <text x="135" y="263" text-anchor="middle" font-size="11.5" font-style="italic" fill="#444">near Guntur"</text>

  <!-- stage 1 : Gemini -->
  <rect x="238" y="182" width="150" height="86" rx="5" fill="#d9e6f2" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="313" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">STAGE 1</text>
  <text x="313" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Understand</text>
  <text x="313" y="244" text-anchor="middle" font-size="11" fill="#333">trade · quantity</text>
  <text x="313" y="259" text-anchor="middle" font-size="11" fill="#333">place · date words</text>

  <!-- stage 2 -->
  <rect x="416" y="182" width="150" height="86" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="491" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 2</text>
  <text x="491" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Fix the values</text>
  <text x="491" y="244" text-anchor="middle" font-size="11" fill="#333">"tomorrow" → date</text>
  <text x="491" y="259" text-anchor="middle" font-size="11" fill="#333">"8 AM" → 08:00</text>

  <!-- stage 3 -->
  <rect x="594" y="182" width="150" height="86" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="669" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 3</text>
  <text x="669" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Eligibility</text>
  <text x="669" y="244" text-anchor="middle" font-size="11" fill="#333">verified · free</text>
  <text x="669" y="259" text-anchor="middle" font-size="11" fill="#333">uncommitted · near</text>

  <!-- stage 4 -->
  <rect x="772" y="182" width="150" height="86" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="847" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 4</text>
  <text x="847" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Rank</text>
  <text x="847" y="244" text-anchor="middle" font-size="11" fill="#333">six weighted</text>
  <text x="847" y="259" text-anchor="middle" font-size="11" fill="#333">factors</text>

  <!-- stage 5 -->
  <rect x="950" y="182" width="150" height="86" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="1025" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 5</text>
  <text x="1025" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Compose</text>
  <text x="1025" y="244" text-anchor="middle" font-size="11" fill="#333">crews, then</text>
  <text x="1025" y="259" text-anchor="middle" font-size="11" fill="#333">individuals</text>

  <!-- stage 6 : Gemini -->
  <rect x="1128" y="182" width="150" height="86" rx="5" fill="#d9e6f2" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="1203" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">STAGE 6</text>
  <text x="1203" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Explain</text>
  <text x="1203" y="244" text-anchor="middle" font-size="11" fill="#333">from the evidence</text>
  <text x="1203" y="259" text-anchor="middle" font-size="11" fill="#333">the tools returned</text>

  <!-- arrows row 1 -->
  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="225" x2="234" y2="225"/>
    <line x1="388" y1="225" x2="412" y2="225"/>
    <line x1="566" y1="225" x2="590" y2="225"/>
    <line x1="744" y1="225" x2="768" y2="225"/>
    <line x1="922" y1="225" x2="946" y2="225"/>
    <line x1="1100" y1="225" x2="1124" y2="225"/>
  </g>

  <!-- wrap arrow down -->
  <path d="M 1203 268 L 1203 300 L 135 300 L 135 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="0"/>

  <!-- stage 7 -->
  <rect x="60" y="344" width="182" height="92" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="151" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 7</text>
  <text x="151" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Propose</text>
  <text x="151" y="406" text-anchor="middle" font-size="11" fill="#333">job · offers</text>
  <text x="151" y="422" text-anchor="middle" font-size="11" font-style="italic" fill="#a33">nothing happens yet</text>

  <!-- confirm gate -->
  <rect x="278" y="344" width="182" height="92" rx="5" fill="#fdf2e0" stroke="#a06a12" stroke-width="2"/>
  <text x="369" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a12">HUMAN GATE</text>
  <text x="369" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">A person confirms</text>
  <text x="369" y="406" text-anchor="middle" font-size="11" fill="#333">the agent has no tool</text>
  <text x="369" y="422" text-anchor="middle" font-size="11" fill="#333">that can do this</text>

  <!-- stage 8 -->
  <rect x="496" y="344" width="182" height="92" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="587" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 8</text>
  <text x="587" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Coordinate</text>
  <text x="587" y="406" text-anchor="middle" font-size="11" fill="#333">offer → response →</text>
  <text x="587" y="422" text-anchor="middle" font-size="11" fill="#333">confirm → booked</text>

  <!-- stage 9 -->
  <rect x="714" y="344" width="182" height="92" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="805" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">STAGE 9</text>
  <text x="805" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Reputation</text>
  <text x="805" y="406" text-anchor="middle" font-size="11" fill="#333">counted from records</text>
  <text x="805" y="422" text-anchor="middle" font-size="11" fill="#333">worker ≠ crew</text>

  <!-- output -->
  <rect x="932" y="344" width="346" height="92" rx="5" fill="#eef4ea" stroke="#3f6b39" stroke-width="1.8"/>
  <text x="1105" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">CONFIRMED WORKFORCE, WITH EVIDENCE</text>
  <text x="1105" y="390" text-anchor="middle" font-size="11.5" fill="#333">Ravi Crew 6 · Bhaskar 1 · Mahesh 1  =  8 of 8 filled</text>
  <text x="1105" y="408" text-anchor="middle" font-size="11.5" fill="#333">each with rating, completed jobs, attendance, distance</text>
  <text x="1105" y="426" text-anchor="middle" font-size="11.5" font-style="italic" fill="#3f6b39">a shortfall is reported, never padded</text>

  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="242" y1="390" x2="274" y2="390"/>
    <line x1="460" y1="390" x2="492" y2="390"/>
    <line x1="678" y1="390" x2="710" y2="390"/>
    <line x1="896" y1="390" x2="928" y2="390"/>
  </g>

  <!-- ================= MODULES ================= -->
  <text x="60" y="500" font-size="16.5" font-weight="bold" fill="#111">THE MODULES</text>
  <line x1="60" y1="508" x2="1420" y2="508" stroke="#bbb" stroke-width="1"/>

  <g font-size="11.5">
    <rect x="60" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="154" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-01  built</text>
    <text x="154" y="570" text-anchor="middle" font-weight="bold" fill="#111">Request Understanding</text>
    <text x="154" y="590" text-anchor="middle" fill="#444">sentence → structure</text>

    <rect x="264" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="358" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-02  built</text>
    <text x="358" y="570" text-anchor="middle" font-weight="bold" fill="#111">Matching Engine</text>
    <text x="358" y="590" text-anchor="middle" fill="#444">filter and rank</text>

    <rect x="468" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="562" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-03  built</text>
    <text x="562" y="570" text-anchor="middle" font-weight="bold" fill="#111">Composition</text>
    <text x="562" y="590" text-anchor="middle" fill="#444">crews + individuals</text>

    <rect x="672" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="766" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-04  built</text>
    <text x="766" y="570" text-anchor="middle" font-weight="bold" fill="#111">Job Coordination</text>
    <text x="766" y="590" text-anchor="middle" fill="#444">propose → confirm</text>

    <rect x="876" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="970" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-05  built</text>
    <text x="970" y="570" text-anchor="middle" font-weight="bold" fill="#111">Reputation</text>
    <text x="970" y="590" text-anchor="middle" fill="#444">counted, not written</text>

    <rect x="1080" y="528" width="188" height="76" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="1174" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f8a">M-06  built</text>
    <text x="1174" y="570" text-anchor="middle" font-weight="bold" fill="#111">Independence</text>
    <text x="1174" y="590" text-anchor="middle" fill="#444">recommends only</text>

    <rect x="1284" y="528" width="136" height="76" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1352" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">M-07  planned</text>
    <text x="1352" y="570" text-anchor="middle" font-weight="bold" fill="#555">Multilingual</text>
    <text x="1352" y="590" text-anchor="middle" fill="#666">EN · TE · HI</text>
  </g>

  <!-- ================= DATA ================= -->
  <text x="60" y="666" font-size="16.5" font-weight="bold" fill="#111">THE DATA  —  PostgreSQL, the single source of truth</text>
  <line x1="60" y1="674" x2="1420" y2="674" stroke="#bbb" stroke-width="1"/>

  <g font-size="11.5" text-anchor="middle">
    <rect x="60" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="136" y="716" font-weight="bold" fill="#111">workers</text>
    <text x="136" y="734" fill="#555">identity, skills</text>

    <rect x="228" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="304" y="716" font-weight="bold" fill="#111">crew_members</text>
    <text x="304" y="734" fill="#555">a relationship</text>

    <rect x="396" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="472" y="716" font-weight="bold" fill="#111">availability</text>
    <text x="472" y="734" fill="#555">who is free</text>

    <rect x="564" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="640" y="716" font-weight="bold" fill="#111">jobs</text>
    <text x="640" y="734" fill="#555">what is needed</text>

    <rect x="732" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="808" y="716" font-weight="bold" fill="#111">job_assignments</text>
    <text x="808" y="734" fill="#555">who did it</text>

    <rect x="900" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="976" y="716" font-weight="bold" fill="#111">ratings</text>
    <text x="976" y="734" fill="#555">worker OR crew</text>

    <rect x="1068" y="694" width="152" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="1144" y="716" font-weight="bold" fill="#111">pending_actions</text>
    <text x="1144" y="734" fill="#555">awaiting a person</text>

    <rect x="1236" y="694" width="184" height="52" rx="4" fill="#f7f7f7" stroke="#888"/>
    <text x="1328" y="716" font-weight="bold" fill="#111">agent_actions</text>
    <text x="1328" y="734" fill="#555">every tool call, logged</text>
  </g>

  <!-- ================= PRINCIPLE ================= -->
  <rect x="60" y="786" width="1360" height="76" rx="5" fill="#f4f4f4" stroke="#555" stroke-width="1.4"/>
  <text x="740" y="816" text-anchor="middle" font-size="17" font-style="italic" font-weight="bold" fill="#111">Gemini reasons; the ADAA application verifies and executes.</text>
  <text x="740" y="843" text-anchor="middle" font-size="12.5" fill="#444">Only two of the nine stages use the language model. Eligibility, distance, scoring, confirmation and reputation are ordinary Python with 222 tests, and give the same answer whether or not the model is available.</text>

  <!-- ================= RULES ================= -->
  <g font-size="12">
    <text x="60" y="898" font-weight="bold" fill="#111">Three guarantees enforced in code, not in instructions to the model:</text>
    <text x="76" y="922" fill="#333">1.  A worker's rating is computed only from ratings addressed to that worker — a crew rated 4.8 does not make its members 4.8 workers.</text>
    <text x="76" y="944" fill="#333">2.  Reputation queries never consult crew membership — which is what lets a worker leave a crew and keep everything he has earned.</text>
    <text x="76" y="966" fill="#333">3.  No tool exists that lets the agent confirm its own proposal, create a job, or change anybody's status. A person does that, or it does not happen.</text>
  </g>

  <text x="740" y="992" text-anchor="middle" font-size="11.5" font-style="italic" fill="#777">Figure 1 · ADAA system architecture — nine-stage pipeline and seven-module component specification</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
</svg>
